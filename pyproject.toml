[tool.ruff]
line-length = 120
target-version = "py311"
# The notebook is kept exactly as it was used for the paper.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ealz", "train", "cross_validate", "explain", "extract_slices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    'ignore:.*deprecated since version 0\.26:FutureWarning',
    "ignore:The structure of `inputs` doesn't match",
]

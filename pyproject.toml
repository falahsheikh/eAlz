[tool.ruff]
line-length = 120
target-version = "py311"
# The notebook is kept exactly as it was used for the paper.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ealz", "train", "cross_validate", "explain", "extract_slices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# TensorFlow and Keras give DeprecationWarnings about their own internals.
filterwarnings = ["ignore::DeprecationWarning"]

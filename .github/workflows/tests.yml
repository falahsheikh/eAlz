name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
